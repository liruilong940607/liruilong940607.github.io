- year: "2019"
  paper-logo: "./projects/deepportaits.png"
  paper-title: "Deep Portrait Image Completion and Extrapolation"
  paper-authors: 
    - name: Xian Wu
      link: 
      institutions: [1]
    - name: <b>Ruilong Li</b>
      link: http://www.liruilong.cn/
      institutions: [1]
    - name: Fang-Lue Zhang
